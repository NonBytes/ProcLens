name: macOS Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Build and package Apple Silicon app
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          build_dir="$RUNNER_TEMP/ProcLens-build"
          xcodebuild -project ProcLens.xcodeproj -scheme ProcLens -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$build_dir" \
            CODE_SIGNING_ALLOWED=NO build

          app="$build_dir/Build/Products/Release/ProcLens.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(lipo -archs "$app/Contents/MacOS/ProcLens")" = arm64
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"

          staging="$RUNNER_TEMP/ProcLens-dmg"
          mkdir "$staging"
          ditto "$app" "$staging/ProcLens.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname ProcLens -srcfolder "$staging" -format UDZO "ProcLens-${version}.dmg"
          hdiutil verify "ProcLens-${version}.dmg"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "ProcLens-${version}.dmg" \
            --verify-tag --title "ProcLens ${version}" --notes-from-tag
