name: macOS Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and package universal app
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          build_dir="$RUNNER_TEMP/ProcLens-build"
          xcodebuild -project ProcLens.xcodeproj -scheme ProcLens -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$build_dir" \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

          app="$build_dir/Build/Products/Release/ProcLens.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/ProcLens"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"

          staging="$RUNNER_TEMP/ProcLens-dmg"
          mkdir "$staging"
          ditto "$app" "$staging/ProcLens.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname ProcLens -srcfolder "$staging" -format UDZO "ProcLens-${version}.dmg"
          hdiutil verify "ProcLens-${version}.dmg"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "ProcLens-${version}.dmg" \
            --verify-tag --title "ProcLens ${version}" --notes-from-tag
